name: Deploy Terraform
on:
  push:
    paths:
      - terraform/**
permissions:
  id-token: write
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #version 7

      - name: 'Az CLI login'
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a #version 2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Install terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #version 4

      - name: 'Terraform fmt'
        working-directory: terraform
        run: terraform fmt -check

      - name: 'Terraform Init'
        working-directory: terraform
        run: |
          terraform init \
          -backend-config="use_msi=true" \
          -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
          -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
          -backend-config="storage_account_name=satfstateappsec" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=dev.terraform.tfstate"

      - name: 'Terraform Validate'
        working-directory: terraform
        run: terraform validate -no-color

      - name: 'Terraform Plan'
        working-directory: terraform
        run: terraform plan -no-color -input=false